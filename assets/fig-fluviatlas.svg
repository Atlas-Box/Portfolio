      <circle cx="328" cy="152" r="13" fill="none" stroke="#2DD4BF" stroke-width="1" opacity=".4"/>
      <text class="tm" x="240" y="186" fill="#2DD4BF">EXUTOIRE</text>
    </g>
    <text class="tm lb" x="20" y="26" fill="#9B8CE8">BASSIN VERSANT DÉLIMITÉ</text>
