<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="Inter,system-ui,sans-serif">
<style>
  .t{fill:#98A5BA;font-size:11px}
  .th{fill:#E8EEF7;font-size:12.5px;font-weight:500}
  .tm{fill:#63718A;font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
  .card{fill:#0C111A;stroke:#1B2536}
  .flow{stroke:#2A3B57;stroke-width:1.5;fill:none;stroke-dasharray:4 5;animation:march 1.3s linear infinite}
  @keyframes march{to{stroke-dashoffset:-18}}
  .stem{stroke-dasharray:520;stroke-dashoffset:520;animation:dr 5.5s ease-out infinite}
  .trib{stroke-dasharray:200;stroke-dashoffset:200;animation:dr2 5.5s ease-out infinite}
  .bv{stroke-dasharray:1150;stroke-dashoffset:1150;animation:dr3 5.5s ease-out infinite}
  @keyframes dr{0%,4%{stroke-dashoffset:520}34%,100%{stroke-dashoffset:0}}
  @keyframes dr2{0%,30%{stroke-dashoffset:200}52%,100%{stroke-dashoffset:0}}
  @keyframes dr3{0%,52%{stroke-dashoffset:1150}84%,100%{stroke-dashoffset:0}}
  .lb{opacity:0;animation:fi 5.5s ease-in-out infinite}
  @keyframes fi{0%,58%{opacity:0}72%,100%{opacity:1}}
  .out{opacity:0;animation:fo 5.5s ease-out infinite}
  @keyframes fo{0%,26%{opacity:0}36%,100%{opacity:1}}
</style>
<rect width="920" height="300" fill="#070A10"/>
<g stroke="#131C29" stroke-width="1">
  <path d="M0 40H920M0 80H920M0 120H920M0 160H920M0 200H920M0 240H920M0 280H920"/>
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300M400 0V300"/>
</g>

<text class="tm" x="28" y="32">1 · MNT COPERNICUS GLO-30 → BASSIN VERSANT</text>

